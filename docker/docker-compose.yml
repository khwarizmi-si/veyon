services:
  veyon-dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: veyon-dev:latest
    container_name: veyon-dev
    # Mount seluruh source code repo ke /veyon di dalam container.
    # Edit file di Mac -> langsung kebaca di container, tinggal `make` ulang.
    volumes:
      - ../:/veyon
    ports:
      - "6080:6080"   # noVNC -> buka http://localhost:6080/vnc.html
    shm_size: "1gb"   # XFCE/Qt butuh shared memory yang cukup
    # NET_ADMIN diperlukan agar add-on Internet Access Control bisa mengubah
    # firewall (iptables) di dalam container saat pengujian.
    cap_add:
      - NET_ADMIN
    stdin_open: true
    tty: true
